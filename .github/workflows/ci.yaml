name: ci

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Run tests
        working-directory: app
        run: python -m pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check commit identity variables
        run: |
          if [ -z "${{ vars.COMMIT_NAME }}" ] || [ -z "${{ vars.COMMIT_EMAIL }}" ]; then
            echo "Set the repository variables COMMIT_NAME and COMMIT_EMAIL first (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/demo-app" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Point the Helm values at the new image
        run: |
          sed -i "s|^  repository:.*|  repository: ${IMAGE}|" helm/demo-app/values.yaml
          sed -i "s|^  tag:.*|  tag: \"${TAG}\"|" helm/demo-app/values.yaml

      - name: Commit the change so Argo CD deploys it
        run: |
          git config user.name "${{ vars.COMMIT_NAME }}"
          git config user.email "${{ vars.COMMIT_EMAIL }}"
          git add helm/demo-app/values.yaml
          git diff --cached --quiet || git commit -m "deploy demo-app ${TAG}"
          git push
