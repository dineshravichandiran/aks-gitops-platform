          "targets": [
            {
              "refId": "A",
              "expr": "demo_app:slo_burn_rate:5m",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
