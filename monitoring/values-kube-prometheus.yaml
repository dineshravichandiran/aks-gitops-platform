# Values for the kube-prometheus-stack Helm chart.
# Grafana's admin password is passed on the command line, see the README.
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and rules from every namespace, not only this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 50Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
