# Optional. Deploys Jaeger + the OpenTelemetry collector, and the Grafana SLO dashboard.
#   kubectl apply -f argocd/observability.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tracing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dineshravichandiran/aks-gitops-platform.git
    targetRevision: main
    path: observability/tracing
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dineshravichandiran/aks-gitops-platform.git
    targetRevision: main
    path: monitoring/dashboards
    directory:
      include: "dashboards-configmap.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
